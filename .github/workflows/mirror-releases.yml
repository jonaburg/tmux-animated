name: mirror-releases

on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:
  pull_request:
    types: [closed]
    branches: [animations]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  # ─── 1. Open a sync PR for any upstream tag we haven't mirrored ──────────
  open-release-pr:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout animations (full history + tags)
        uses: actions/checkout@v4
        with:
          ref: animations
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf automake pkg-config bison \
            libevent-dev libncurses-dev libutempter-dev

      - name: Fetch upstream tags
        run: |
          git remote add upstream https://github.com/tmux/tmux.git
          git fetch upstream --tags --no-tags \
            'refs/tags/[0-9]*:refs/tags/upstream-[0-9]*' || true
          git fetch upstream 'refs/tags/*:refs/tags/upstream-*'

      - name: Pick newest unmirrored upstream tag
        id: pick
        run: |
          # All upstream release-shaped tags (e.g. 3.5, 3.5a, 3.6), newest first.
          mapfile -t up < <(git tag --list 'upstream-[0-9]*' \
            | sed 's/^upstream-//' \
            | grep -E '^[0-9]+\.[0-9]+[a-z]?$' \
            | sort -V -r)
          for tag in "${up[@]}"; do
            if ! git rev-parse -q --verify "refs/tags/v${tag}-animated" >/dev/null; then
              echo "tag=$tag" >> "$GITHUB_OUTPUT"
              echo "Picked upstream tag: $tag"
              exit 0
            fi
          done
          echo "All upstream release tags already mirrored."
          echo "tag=" >> "$GITHUB_OUTPUT"

      - name: Configure bot identity
        if: steps.pick.outputs.tag != ''
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Create sync branch and merge upstream tag
        if: steps.pick.outputs.tag != ''
        id: merge
        run: |
          TAG="${{ steps.pick.outputs.tag }}"
          BRANCH="bot/release-sync-${TAG}"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          git checkout -b "$BRANCH"
          if ! git merge --no-edit --no-ff "upstream-${TAG}" \
                -m "Merge upstream tmux ${TAG} into animations"; then
            git merge --abort || true
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "conflict=false" >> "$GITHUB_OUTPUT"

      - name: Regenerate patch
        if: steps.pick.outputs.tag != '' && steps.merge.outputs.conflict == 'false'
        run: |
          git fetch origin master:refs/remotes/origin/master
          git diff origin/master..HEAD -- ':!patches/' \
            > patches/tmux-animated-next-3.7.patch
          if ! git diff --quiet -- patches/; then
            git add patches/tmux-animated-next-3.7.patch
            git commit -m "Regenerate patch for tmux ${{ steps.pick.outputs.tag }}"
          fi

      - name: Build to verify
        if: steps.pick.outputs.tag != '' && steps.merge.outputs.conflict == 'false'
        run: |
          ./autogen.sh
          ./configure
          make -j"$(nproc)"
          ./tmux -V

      - name: Push branch and open PR
        if: steps.pick.outputs.tag != '' && steps.merge.outputs.conflict == 'false'
        env:
          BRANCH: ${{ steps.merge.outputs.branch }}
          TAG:    ${{ steps.pick.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push --force-with-lease origin "$BRANCH"
          # PR title carries the version so the merge handler can recover it.
          printf 'Mirrors upstream tmux release `%s` into animations.\n\nWhen merged, the post-merge job will tag the merge commit as `v%s-animated`.\n' "$TAG" "$TAG" > /tmp/pr-body.md
          gh pr create \
            --base animations \
            --head "$BRANCH" \
            --title "Release sync: tmux ${TAG}" \
            --label release-sync \
            --body-file /tmp/pr-body.md \
            || echo "PR may already exist; continuing."

      - name: Open issue on merge conflict
        if: steps.pick.outputs.tag != '' && steps.merge.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.pick.outputs.tag }}
        run: |
          gh issue create \
            --title "Release sync conflict: tmux ${TAG}" \
            --label upstream-drift \
            --body "Could not merge upstream tag \`${TAG}\` into animations. Manual merge required.

Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  # ─── 2. When a release-sync PR is merged, tag the merge commit ──────────
  tag-on-merge:
    if: >
      github.event_name == 'pull_request'
      && github.event.pull_request.merged == true
      && contains(github.event.pull_request.labels.*.name, 'release-sync')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: animations
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from PR title
        id: ver
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Expect "Release sync: tmux <version>"
          VER=$(echo "$TITLE" | sed -nE 's/^Release sync: tmux ([0-9]+\.[0-9]+[a-z]?).*/\1/p')
          if [ -z "$VER" ]; then
            echo "Could not parse version from PR title: $TITLE" >&2
            exit 1
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        env:
          SHA: ${{ github.event.pull_request.merge_commit_sha }}
          VER: ${{ steps.ver.outputs.version }}
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          TAG="v${VER}-animated"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} already exists; nothing to do."
            exit 0
          fi
          git tag -a "${TAG}" "${SHA}" -m "tmux-animated for tmux ${VER}"
          git push origin "${TAG}"
